<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CyberPay AI</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style Sheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-body">

    <div class="auth-glow-1"></div>
    <div class="auth-glow-2"></div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-brain"></i>
                <span>CyberPay AI</span>
            </div>
            <h2>Welcome Back</h2>
            <p>Access your AI digital payment dashboard</p>
        </div>

        <div class="glass-card auth-card fade-in">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="input-control" placeholder="alex.mercer@cyberpay.ai" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="loginPassword">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" class="input-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" id="passToggle">
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-actions">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" id="forgotPassLink">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary auth-btn">Secure Login <i class="fa-solid fa-shield-halved"></i></button>
            </form>

            <div class="auth-footer">
                <p>New to CyberPay? <a href="register.html">Create an Account</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passToggle = document.getElementById('passToggle');
            const passwordInput = document.getElementById('loginPassword');

            if (passToggle && passwordInput) {
                passToggle.addEventListener('click', () => {
                    const isPass = passwordInput.type === 'password';
                    passwordInput.type = isPass ? 'text' : 'password';
                    passToggle.innerHTML = isPass ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
                });
            }

            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const email = document.getElementById('loginEmail').value.trim();
                    const password = passwordInput.value;

                    if (!email || !password) {
                        showToast('Please enter credentials.', 'warning');
                        return;
                    }

                    try {
                        const res = await db.fetch('/auth/login', {
                            method: 'POST',
                            body: JSON.stringify({ email, password })
                        });

                        if (res.success) {
                            db.setToken(res.data.token);
                            db.setUser(res.data.user);
                            showToast('Login authorized. Welcoming Alex Mercer...', 'success');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 1000);
                        }
                    } catch (err) {
                        showToast(err.message, 'danger');
                    }
                });
            }

            const forgotLink = document.getElementById('forgotPassLink');
            if (forgotLink) {
                forgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    const email = prompt('Enter your registered email address to receive password reset link:');
                    if (email) {
                        showToast(`Simulated reset link sent to: ${email}`, 'success');
                    }
                });
            }
        });
    </script>
</body>
</html>
