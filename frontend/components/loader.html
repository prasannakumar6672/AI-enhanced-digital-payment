<!-- Component: Page Loader Overlay -->
<div class="loader-overlay" id="appLoader" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.7); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); justify-content:center; align-items:center; z-index:9999;">
    <div class="spinner" style="width:48px; height:48px; border:4px solid rgba(255,255,255,0.1); border-left-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite;"></div>
</div>
